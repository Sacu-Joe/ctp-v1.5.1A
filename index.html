<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>校园任务平台</title>
  <!-- 安全策略：只允许自身资源；禁止内联事件脚本（防导入内容注入）；无外部请求 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'nonce-CP2026'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: data:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#0d9488">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="校园任务平台">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/pwa-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="window">
    <!-- 上方主区：标题栏 + 内容 -->
    <section class="main">
      <div class="main-top">
        <h2 id="viewTitle">你好</h2>
        <span class="date" id="dateText"></span>
        <span class="school-chip school-label" id="schoolChip" title="学校管理请到「设置 → 通用」">
          <img src="icons/school.png" class="ico" alt="学校">
          <span id="schoolName">我的学校</span>
        </span>
      </div>
      <div class="view-root" id="viewRoot"></div>
    </section>

    <!-- 底部导航（约 1/6 高度）：首页 + 5 模块 + 设置 -->
    <nav class="bottom-nav">
      <div class="bn-item" id="brandHome" title="返回首页">
        <img src="icons/home.png" class="bn-ico" alt="首页"><span>首页</span>
      </div>
      <div id="nav" class="bn-modules"></div>
      <div class="bn-item" id="btnGlobalSettings" title="设置">
        <img src="icons/settings.png" class="bn-ico" alt="设置"><span>设置</span>
      </div>
    </nav>
  </div>

  <div id="toastLayer"></div>

  <!-- 顺序加载（普通脚本，无需构建；双击 / 本地服务器 / WebView 均可运行） -->
  <script src="js/vendor/dexie.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ical.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/app.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/timetable.js"></script>
  <script src="js/views/schedule.js"></script>
  <script src="js/views/activity.js"></script>
  <script src="js/views/notes.js"></script>
  <script src="js/views/scores.js"></script>
  <script nonce="CP2026">
    // 所有脚本按序加载完成后启动应用
    window.addEventListener('error', function (e) {
      console.error(e.message, e.filename, e.lineno);
    });
    // 注册 Service Worker（PWA 离线缓存；需 HTTPS 或 localhost）
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.error('ServiceWorker 注册失败：', err);
        });
      });
    }
    App.boot();
  </script>
</body>
</html>
