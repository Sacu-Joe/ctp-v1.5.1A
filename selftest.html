<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园任务平台 · 数据层自检</title>
  <link rel="stylesheet" href="css/selftest.css">
</head>
<body>
  <div class="wrap">
    <a class="toplink" href="index.html">← 返回应用</a>
    <h1>校园任务平台 · HTML 数据层自检</h1>
    <p class="lead">
      本页不依赖网络，直接在浏览器 / WebView 的 IndexedDB 上验证数据层：建库与首启种子、设置、
      学校与级联删除、课程 / 教学周 / 单双周 / 连堂、日程、活动归档、笔记科目、图片存取、备份导出导入与重启持久化。
      页面打开后会自动运行全部用例（会清空并重建数据库，仅用于验证）。
    </p>

    <div class="toolbar">
      <button id="btnRun">重新运行自检</button>
      <button id="btnExport" class="secondary">导出备份（JSON）</button>
      <button id="btnImport" class="secondary">导入备份（JSON）</button>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none">
      <button id="btnReset" class="secondary">重置为初始空数据</button>
    </div>

    <div id="summary">准备运行…</div>
    <pre id="log">正在初始化…</pre>
  </div>

  <!-- 顺序加载：第三方库 → 工具 → 建库 → 数据访问层 → 自检（均为普通脚本，无需构建，双击 / WebView 均可） -->
  <script src="js/vendor/dexie.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/store.js"></script>
  <script src="js/selftest.js"></script>
</body>
</html>
